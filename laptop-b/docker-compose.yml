name: presma-b

services:
  cloud-api:
    build: ./cloud-api
    ports:
      - "9090:8000"
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      SERVICE: cloud-api
    volumes:
      - data-pusat:/data
      - log-b:/log
    depends_on:
      - mosquitto
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

volumes:
  data-pusat:
  log-b:
