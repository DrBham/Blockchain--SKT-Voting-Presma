<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Bilik Suara - Pemilihan Presma UNTAD</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; background: #EDF1F4; color: #16232E; margin: 0; }
  main { max-width: 560px; margin: 28px auto; background: #fff; padding: 28px 32px;
         border-radius: 12px; border: 1px solid #D3DBE1; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .redup { color: #6B7C8A; margin: 0 0 18px; }
  label { display: block; margin: 14px 0 6px; font-weight: bold; }
  input[type=text] { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box;
                     border: 1px solid #D3DBE1; border-radius: 8px; }
  .pilihan { display: block; padding: 10px 12px; margin: 6px 0; border: 1px solid #D3DBE1;
             border-radius: 8px; font-weight: normal; cursor: pointer; }
  button { margin-top: 16px; padding: 11px 18px; border: 0; border-radius: 8px; color: #fff;
           background: #1C7293; font-size: 16px; cursor: pointer; }
  #hasil { margin-top: 16px; padding: 12px 14px; border-radius: 8px; display: none; }
  .baik { background: #ECF4F8; color: #1C7293; }
  .buruk { background: #FCF2EC; color: #B5392B; }
  footer { margin-top: 20px; font-size: 14px; color: #6B7C8A; }
  #bukti { margin-top: 12px; display: none; }
  #bukti code { display: block; font-size: 22px; letter-spacing: 1px; margin: 6px 0; }
  #bukti button { margin-top: 6px; padding: 7px 12px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Bilik Suara Presma UNTAD</h1>
  <p class="redup">TPS <b id="tps">-</b> (edge-api di Laptop A). Pemungutan: <b id="pemungutan">-</b></p>
  <label for="pemilih">NIM pemilih</label>
  <input type="text" id="pemilih" placeholder="contoh: F55125001">
  <label>Pilihan</label>
  <div id="kandidat"></div>
  <button onclick="pilih()">Masukkan suara</button>
  <div id="hasil"></div>
  <div id="bukti" class="baik">Kode bukti suara Anda (simpan untuk dicek di papan hasil):
    <code id="kode"></code>
    <button onclick="cekBukti()">Cek status di TPS</button> <span id="status-bukti"></span>
  </div>
  <footer>Masuk <b id="masuk">0</b> | diterima <b id="diterima">0</b> | ditolak <b id="ditolak">0</b>
          | menunggu disetor <b id="antre">-</b> | sudah disetor <b id="terkirim">-</b></footer>
</main>
<script>
async function muatDaftar() {
  const d = await (await fetch('/daftar')).json();
  document.getElementById('tps').textContent = d.tps_id;
  document.getElementById('kandidat').innerHTML = Object.entries(d.kandidat).map(k =>
    '<label class="pilihan"><input type="radio" name="pilihan" value="' + k[0] + '"> ' +
    k[0] + '. ' + k[1] + '</label>').join('');
}
async function muatStatus() {
  const s = await (await fetch('/status')).json();
  for (const k of ['pemungutan', 'masuk', 'diterima', 'ditolak', 'antre', 'terkirim'])
    if (k in s) document.getElementById(k).textContent = s[k];
}
async function pilih() {
  const pemilih = document.getElementById('pemilih').value.trim().toUpperCase();
  const pilihan = document.querySelector('input[name=pilihan]:checked');
  const hasil = document.getElementById('hasil');
  hasil.style.display = 'block';
  if (!pemilih || !pilihan) {
    hasil.className = 'buruk';
    hasil.textContent = 'Isi NIM dan pilih satu paslon.';
    return;
  }
  const r = await (await fetch('/suara', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pemilih_id: pemilih, pilihan: Number(pilihan.value)})
  })).json();
  hasil.className = r.diterima ? 'baik' : 'buruk';
  hasil.textContent = r.diterima
    ? 'Suara ' + pemilih + ' diterima. Nomor urut di TPS: ' + r.seq + '.'
    : 'Suara ' + pemilih + ' ditolak: ' + r.alasan + '.';
  document.getElementById('bukti').style.display = r.diterima ? 'block' : 'none';
  document.getElementById('kode').textContent = r.bukti || '';
  document.getElementById('status-bukti').textContent = '';
  muatStatus();
}
async function cekBukti() {
  const kode = document.getElementById('kode').textContent;
  const r = await (await fetch('/bukti/' + encodeURIComponent(kode))).json();
  document.getElementById('status-bukti').textContent = r.status;
}
muatDaftar();
muatStatus();
setInterval(muatStatus, 3000);
</script>
</body>
</html>
